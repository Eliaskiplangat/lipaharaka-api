services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lipaharaka
      POSTGRES_USER: lipaharaka
      POSTGRES_PASSWORD: lipaharaka
    ports:
      - "5434:5432"
    volumes:
      - lipaharaka_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lipaharaka"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  lipaharaka_pg_data: